/* Migration is additive and id-preserving: old saves keep their exercise ids,
   logs and splits. Every new field gets a default here. */
function migrate(data){
  if(data.routineDays && !data.splits){
    data.splits = { ppl:{ label:'PPL', days:data.routineDays }, pplul: seedSplits(data.exercises).pplul };
    data.activeSplit = 'ppl';
    delete data.routineDays;
  }
  if(!data.splits) data.splits = seedSplits(data.exercises);
  if(!data.activeSplit || !data.splits[data.activeSplit]) data.activeSplit = 'ppl';
  if(!data.progress) data.progress = {};
  if(!Array.isArray(data.presets)) data.presets = [];
  data.presets = data.presets.filter(p=>p && p.split && p.split.days);
  data.presets.forEach(p=>{
    if(!p.id) p.id = uid();
    if(typeof p.name !== 'string' || !p.name.trim()) p.name = 'Untitled preset';
    if(typeof p.subtitle !== 'string') p.subtitle = '';
    if(!p.splitKey || !data.splits[p.splitKey]) p.splitKey = data.activeSplit || 'ppl';
  });

  const s = data.settings = data.settings || {};
  s.units = 'kg';
  if(typeof s.userName !== 'string' || !s.userName.trim()) s.userName = DEFAULT_USER_NAME;
  if(!TRAINING.goals[s.goal]) s.goal = 'hypertrophy';
  const preset = TRAINING.goals[s.goal];
  s.overload = s.overload || {};
  if(typeof s.overload.repsToEarnIncrease !== 'number') s.overload.repsToEarnIncrease = preset.repsToEarnIncrease;
  if(typeof s.overload.sessionsRequired !== 'number') s.overload.sessionsRequired = preset.sessionsRequired;
  if(typeof s.restDefaultMinutes !== 'number') s.restDefaultMinutes = 3;
  if(typeof s.restNotify !== 'boolean') s.restNotify = true;
  if(typeof s.restVibrate !== 'boolean') s.restVibrate = true;
  if(typeof s.restSetupAsked !== 'boolean') s.restSetupAsked = false;
  if(typeof s.restBatteryHintDismissed !== 'boolean') s.restBatteryHintDismissed = false;
  if(!DAY_KEYS.includes(s.weighInDay)) s.weighInDay = 'mon';
  if(typeof s.dismissedGodsPlan !== 'boolean') s.dismissedGodsPlan = false;

  if(!Array.isArray(data.bodyWeight)) data.bodyWeight = [];
  data.bodyWeight = data.bodyWeight.filter(e=>e && typeof e.weight==='number' && e.date);
  data.bodyWeight.forEach(e=>{
    if(!e.id) e.id = uid();
    if(typeof e.note !== 'string') e.note = '';
  });

  /* exercises → v2 metadata shape */
  data.exercises.forEach(e=>{
    const meta = CATALOG_BY_NAME[(e.name||'').trim().toLowerCase()];
    if(e.metaVersion !== 2){
      const legacyEquipment = (e.equipment||'').trim();
      if(meta){
        e.primary = meta.primary; e.secondary = meta.secondary.slice();
        e.pattern = meta.pattern; e.tier = meta.tier; e.popularity = meta.popularity;
        if(!e.metric) e.metric = meta.metric;
        if(legacyEquipment && !EQUIPMENT_LABELS[legacyEquipment.toLowerCase()]) e.equipmentNote = legacyEquipment;
        e.equipment = meta.equipment;
      } else {
        e.primary = e.primary || LEGACY_MUSCLE_MAP[e.muscleGroup] || 'Other';
        e.secondary = Array.isArray(e.secondary) ? e.secondary : [];
        e.pattern = e.pattern || 'other';
        e.tier = e.tier || 'isolation';
        e.popularity = typeof e.popularity==='number' ? e.popularity : 50;
        if(EQUIPMENT_LABELS[legacyEquipment.toLowerCase()]) e.equipment = legacyEquipment.toLowerCase();
        else {
          if(legacyEquipment) e.equipmentNote = legacyEquipment;
          e.equipment = guessEquipment(legacyEquipment) || guessEquipment(e.name) || 'other';
        }
      }
      e.userAdded = (typeof e.userAdded==='boolean') ? e.userAdded : !!e.isCustom;
      e.metaVersion = 2;
    }
    if(!e.catalogKey){
      const byName = CATALOG_BY_NAME[(e.name||'').trim().toLowerCase()];
      if(byName) e.catalogKey = byName.name;
    }
    if(!e.metric) e.metric = 'weight_reps';
    if(!e.equipmentNote) e.equipmentNote = '';
    if(typeof e.flagged !== 'boolean') e.flagged = false;
    if(!MUSCLES.includes(e.primary)) e.primary = LEGACY_MUSCLE_MAP[e.primary] || 'Other';
    e.muscleGroup = e.primary; // legacy alias kept in sync
  });

  /* top up the library with catalog movements the user doesn't have */
  const known = new Set();
  data.exercises.forEach(e=>{
    known.add((e.name||'').trim().toLowerCase());
    if(e.catalogKey) known.add(String(e.catalogKey).trim().toLowerCase());
  });
  CATALOG.forEach(c=>{ if(!known.has(c.name.toLowerCase())) data.exercises.push(makeExercise(c)); });

  /* split rows */
  Object.values(data.splits).forEach(split=>{
    DAY_KEYS.forEach(dk=>{
      if(!split.days[dk]) split.days[dk] = {name:'Rest', exercises:[]};
      if(!Array.isArray(split.days[dk].exercises)) split.days[dk].exercises = [];
      split.days[dk].exercises.forEach(row=>{
        if(typeof row.rpe === 'undefined') row.rpe = null;
        if(typeof row.notes !== 'string') row.notes = '';
        if(!row.sets) row.sets = 3;
        if(!row.repsMin) row.repsMin = 8;
        if(!row.repsMax) row.repsMax = 12;
        if(typeof row.restSeconds === 'undefined') row.restSeconds = null; // null = use the global default
        if(typeof row.supersetId === 'undefined') row.supersetId = null;
        if(typeof row.oftenDoneAsDropSet !== 'boolean') row.oftenDoneAsDropSet = false;
      });
    });
  });

  /* logs + sets */
  data.logs.forEach(log=>{
    log.sets.forEach(set=>{
      if(typeof set.difficulty === 'number') set.difficulty = set.difficulty<=4?'easy':(set.difficulty<=7?'med':'hard');
      if(typeof set.isPR !== 'boolean') set.isPR = false;
      if(typeof set.intent === 'undefined') set.intent = null; // 'strength' when the user tags a low-rep set
      if(typeof set.isDropSet !== 'boolean') set.isDropSet = false;
      if(set.isDropSet && !Array.isArray(set.stages)) set.stages = [];
      if(typeof set.isWarmup !== 'boolean') set.isWarmup = false;
    });
    if(typeof log.active !== 'boolean') log.active = false;
    if(typeof log.completed !== 'boolean') log.completed = log.sets.length>0;
    if(typeof log.startedAt === 'undefined') log.startedAt = null;
    if(typeof log.endedAt === 'undefined') log.endedAt = null;
    /* elapsedMs is foreground time only. timerRunningSince is never trusted
       across a launch: a killed WebView must not add the time the app was closed. */
    if(typeof log.elapsedMs !== 'number' || !isFinite(log.elapsedMs) || log.elapsedMs<0){
      log.elapsedMs = (!log.active && log.startedAt && log.endedAt) ? Math.max(0, log.endedAt - log.startedAt) : 0;
    }
    log.timerRunningSince = null;
    if(typeof log.plan === 'undefined') log.plan = null;
    if(typeof log.planName !== 'string') log.planName = '';
    if(!Array.isArray(log.queued)) log.queued = [];
    else log.queued = log.queued.filter(row=>row && row.exerciseId);
    if(!Array.isArray(log.hiddenExerciseIds)) log.hiddenExerciseIds = [];
    if(Array.isArray(log.plan)) log.plan.forEach(row=>{
      if(typeof row.supersetId === 'undefined') row.supersetId = null;
      if(typeof row.oftenDoneAsDropSet !== 'boolean') row.oftenDoneAsDropSet = false;
      if(typeof row.restSeconds === 'undefined') row.restSeconds = null;
      if(typeof row.sessionOnly !== 'boolean') row.sessionOnly = false;
    });
    log.queued.forEach(row=>{
      if(typeof row.sessionOnly !== 'boolean') row.sessionOnly = true;
    });
  });
  /* same field defaults on saved presets */
  (data.presets||[]).forEach(p=>{
    if(!p.split || !p.split.days) return;
    DAY_KEYS.forEach(dk=>{
      (p.split.days[dk] && p.split.days[dk].exercises || []).forEach(row=>{
        if(typeof row.rpe === 'undefined') row.rpe = null;
        if(typeof row.notes !== 'string') row.notes = '';
        if(!row.sets) row.sets = 3;
        if(!row.repsMin) row.repsMin = 8;
        if(!row.repsMax) row.repsMax = 12;
        if(typeof row.restSeconds === 'undefined') row.restSeconds = null;
        if(typeof row.supersetId === 'undefined') row.supersetId = null;
        if(typeof row.oftenDoneAsDropSet !== 'boolean') row.oftenDoneAsDropSet = false;
      });
    });
  });
  ensureGodsPlanPreset(data);
  return data;
}

function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){ const fresh = defaultData(); saveData(fresh); return fresh; }
  const stashBroken = ()=>{ try{ localStorage.setItem(STORAGE_KEY+'_broken', raw); }catch(e){} };
  try{
    const parsed = JSON.parse(raw);
    if(!parsed.exercises) throw new Error('unrecognised save shape');
    const migrated = migrate(parsed);
    saveData(migrated);
    return migrated;
  }catch(err){
    console.error(APP_NAME+': storage read failed', err);
    stashBroken();
    const bak = localStorage.getItem(STORAGE_KEY+'_bak');
    if(bak && bak!==raw){
      try{
        const parsed = JSON.parse(bak);
        if(!parsed.exercises) throw new Error('backup unrecognised');
        const recovered = migrate(parsed);
        saveData(recovered);
        setTimeout(()=> showToast('Restored from backup after a save error'), 400);
        return recovered;
      }catch(err2){ console.error(APP_NAME+': backup restore failed', err2); }
    }
    const fresh = defaultData(); saveData(fresh); return fresh;
  }
}
function saveData(data){
  if(dataReady) captureActiveWorkoutElapsed();
  setIndex = null;
  try{
    const next = JSON.stringify(data || DATA);
    const prev = localStorage.getItem(STORAGE_KEY);
    if(prev && prev!==next){
      try{ localStorage.setItem(STORAGE_KEY+'_bak', prev); }catch(e){}
    }
    localStorage.setItem(STORAGE_KEY, next);
  }
  catch(err){ console.error(APP_NAME+': storage write failed', err); showToast('Could not save — storage unavailable'); }
}

/* Derived index: exerciseId → all logged sets (each carrying its date), oldest first.
   Declared before DATA because saveData() invalidates it. Rebuilt lazily. */
let setIndex = null;
let dataReady = false;
let DATA = loadData();
dataReady = true;
function buildSetIndex(){
  setIndex = {};
  [...DATA.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(log=>{
    log.sets.forEach(set=>{ (setIndex[set.exerciseId] ||= []).push({...set, date:log.date}); });
  });
}
function loggedSetsForExercise(exerciseId){
  if(!setIndex) buildSetIndex();
  return setIndex[exerciseId] || [];
}
function hasHistory(exerciseId){ return loggedSetsForExercise(exerciseId).length>0; }

/* ============================= §4 MODEL ============================= */
function cloneSplit(split){ return JSON.parse(JSON.stringify(split)); }
function trainedDayCount(split){
  if(!split || !split.days) return 0;
  return DAY_KEYS.filter(dk=>((split.days[dk]||{}).exercises||[]).length).length;
}
function activeSplit(){ return DATA.splits[DATA.activeSplit]; }
function splitDays(){ return activeSplit().days; }
function getExercise(id){ return DATA.exercises.find(e=>e.id===id); }
function metricOf(ex){ return (ex && ex.metric) || 'weight_reps'; }
function primaryOf(ex){ return (ex && (ex.primary || ex.muscleGroup)) || 'Other'; }
function secondaryOf(ex){ return (ex && ex.secondary) || []; }
function patternOf(ex){ return (ex && ex.pattern) || 'other'; }
function equipOf(ex){ return (ex && ex.equipment) || 'other'; }
function tierOf(ex){ return (ex && ex.tier) || 'isolation'; }
function equipLabel(ex){ return EQUIPMENT_LABELS[equipOf(ex)] || 'Other'; }
function goalConfig(){
  const preset = TRAINING.goals[DATA.settings.goal] || TRAINING.goals.hypertrophy;
  return {...preset, ...DATA.settings.overload, key:DATA.settings.goal};
}

/* Library ordering: compounds first, then by popularity, then alphabetically. */
function compareExercises(a,b){
  const tier = (tierOf(a)==='compound'?0:1) - (tierOf(b)==='compound'?0:1);
  if(tier) return tier;
  const pop = (b.popularity||0) - (a.popularity||0);
  if(pop) return pop;
  return a.name.localeCompare(b.name);
}
function exercisesForMuscle(muscle){ return DATA.exercises.filter(e=>primaryOf(e)===muscle).sort(compareExercises); }
function searchExercises(term, pool){
  const t = (term||'').trim().toLowerCase();
  const list = (pool||DATA.exercises).slice();
  if(!t) return list.sort(compareExercises);
  return list.filter(e=>
      e.name.toLowerCase().includes(t) ||
      primaryOf(e).toLowerCase().includes(t) ||
      equipLabel(e).toLowerCase().includes(t) ||
      secondaryOf(e).some(m=>m.toLowerCase().includes(t))
    ).sort((a,b)=>{
      const sa = a.name.toLowerCase().startsWith(t)?0:1, sb = b.name.toLowerCase().startsWith(t)?0:1;
      return sa!==sb ? sa-sb : compareExercises(a,b);
    });
}
function exerciseSubtitle(ex){
  const bits = [primaryOf(ex), equipLabel(ex)];
  if(patternOf(ex)!=='other') bits.push(PATTERN_LABELS[patternOf(ex)]);
  if(metricOf(ex)!=='weight_reps') bits.push(METRIC_LABELS[metricOf(ex)]);
  return bits.join(' · ');
}

/* --- today's log & plan ---------------------------------------------
   DATA.activeSplit is the current split. Home follows it. Saving a day,
   copying a day, switching PPL / PPL + UL, or loading a preset refreshes
   an in-progress workout and, when today already has a saved plan, the
   hit list too. A hit list with no saved plan reads the split directly.
   sessionOnly rows were added for this workout only. hiddenExerciseIds
   are split exercises removed from this workout without deleting them
   from the split. */
function todayLog(){
  const overnight = DATA.logs.find(l=>l.active);
  if(overnight) return overnight;
  const date = todayKey();
  let log = DATA.logs.find(l=>l.date===date);
  if(log) return log;
  return {id:uid(), date, dayKey:weekdayKey(), sets:[], active:false, completed:false,
    startedAt:null, endedAt:null, elapsedMs:0, timerRunningSince:null, plan:null, planName:'', _transient:true};
}
function persistLog(log){
  if(!log || !log._transient) return log;
  delete log._transient;
  if(!DATA.logs.some(l=>l.id===log.id)) DATA.logs.push(log);
  return log;
}
function routineForLog(log){ return splitDays()[log.dayKey] || {name:'Rest', exercises:[]}; }
function planForLog(log){ return Array.isArray(log.plan) ? log.plan : routineForLog(log).exercises; }
function planNameForLog(log){ return log.planName || routineForLog(log).name || 'Workout'; }
function ensurePlanSnapshot(log){
  persistLog(log);
  if(!Array.isArray(log.plan)){
    const routine = routineForLog(log);
    log.plan = JSON.parse(JSON.stringify(routine.exercises || []));
    log.plan.forEach(row=>{ row.sessionOnly = false; });
    log.planName = routine.name || 'Workout';
    saveData(DATA);
  }
  return log.plan;
}
function splitDayFor(dayKey){
  return splitDays()[dayKey] || {name:'Rest', exercises:[]};
}
function exerciseInSplit(dayKey, exerciseId){
  return (splitDayFor(dayKey).exercises || []).some(r=>r.exerciseId===exerciseId);
}
function dissolveTinySupersets(rows){
  const counts = {};
  rows.forEach(r=>{ if(r.supersetId) counts[r.supersetId] = (counts[r.supersetId]||0)+1; });
  rows.forEach(r=>{ if(r.supersetId && counts[r.supersetId]<2) r.supersetId = null; });
}
function absorbQueuedExercises(log){
  const queued = Array.isArray(log.queued) ? log.queued : [];
  log.queued = [];
  const plan = ensurePlanSnapshot(log);
  queued.forEach(row=>{
    if(!row || !row.exerciseId) return;
    if(plan.some(r=>r.exerciseId===row.exerciseId)) return;
    const copy = JSON.parse(JSON.stringify(row));
    copy.sessionOnly = true;
    plan.push(copy);
  });
  return plan;
}
/* The log Home is showing. An in-progress workout wins. Otherwise, a
   save / switch / preset load can refresh today's stored plan so the hit
   list matches the split after the workout has already been started once.
   A day with no stored plan is left alone — the hit list reads the split. */
function homePlanLog(opts){
  const active = activeWorkoutLog();
  if(active) return active;
  if(!opts || (!opts.fromSave && !opts.replaceAll)) return null;
  const log = DATA.logs.find(l=>l.date===todayKey());
  if(!log || !Array.isArray(log.plan)) return null;
  return log;
}
/* Pull the current split's day into the plan Home shows.
   replaceAll is for switching splits or loading a preset.
   dayKey limits a day-save to that plan's weekday.
   Returns true when a stored plan was rewritten. */
function syncActiveWorkoutFromSplit(opts){
  opts = opts || {};
  const log = homePlanLog(opts);
  if(!log) return false;
  const dayKey = log.dayKey || weekdayKey();
  if(opts.dayKey && opts.dayKey!==dayKey) return false;
  if(!Array.isArray(log.hiddenExerciseIds)) log.hiddenExerciseIds = [];
  const routine = splitDays()[dayKey] || {name:'Rest', exercises:[]};
  const incoming = routine.exercises || [];
  const incomingIds = new Set(incoming.map(r=>r.exerciseId));
  if(opts.replaceAll) log.hiddenExerciseIds = [];
  else if(opts.fromSave) log.hiddenExerciseIds = log.hiddenExerciseIds.filter(id=> !incomingIds.has(id));
  else log.hiddenExerciseIds = log.hiddenExerciseIds.filter(id=> incomingIds.has(id));
  const fresh = JSON.parse(JSON.stringify(incoming.filter(r=> !log.hiddenExerciseIds.includes(r.exerciseId))));
  fresh.forEach(row=>{ row.sessionOnly = false; });
  const extras = opts.replaceAll ? [] : (log.plan||[]).filter(row=>
    row && row.sessionOnly && row.exerciseId && !incomingIds.has(row.exerciseId)
  );
  log.plan = fresh.concat(extras);
  log.planName = routine.name || 'Workout';
  return true;
}
function selectCurrentSplit(key){
  if(!DATA.splits[key] || DATA.activeSplit===key) return;
  DATA.activeSplit = key;
  syncActiveWorkoutFromSplit({replaceAll:true});
  saveData(DATA);
  const label = DATA.splits[key].label;
  showToast(activeWorkoutLog() ? `${label} is the current split. Today’s workout updated.` : `${label} is the current split`);
  renderApp();
}
function commitExerciseToSplit(log, exerciseId){
  const dayKey = log.dayKey || weekdayKey();
  const day = splitDays()[dayKey];
  if(!day){ showToast('Could not find that day on your split'); return; }
  if(!day.exercises.some(r=>r.exerciseId===exerciseId)){
    const sessionRow = (log.plan||[]).find(r=>r.exerciseId===exerciseId);
    const copy = JSON.parse(JSON.stringify(sessionRow || newPlanRow(exerciseId,{goal:DATA.settings.goal})));
    delete copy.sessionOnly;
    day.exercises.push(copy);
  }
  const sessionRow = (log.plan||[]).find(r=>r.exerciseId===exerciseId);
  if(sessionRow) sessionRow.sessionOnly = false;
  saveData(DATA);
  showToast('Added to your split');
  renderApp();
}
function addExerciseToActiveWorkout(exerciseId){
  const log = todayLog();
  if(!log.active){ showToast('Start the workout first'); return; }
  persistLog(log);
  const plan = ensurePlanSnapshot(log);
  if(plan.some(r=>r.exerciseId===exerciseId)){ showToast('Already in this workout'); return; }
  const row = newPlanRow(exerciseId,{goal:DATA.settings.goal});
  const dayKey = log.dayKey || weekdayKey();
  const inSplit = exerciseInSplit(dayKey, exerciseId);
  row.sessionOnly = !inSplit;
  plan.push(row);
  saveData(DATA);
  renderApp();
  if(inSplit){ showToast('Added to this workout'); return; }
  const name = (getExercise(exerciseId)||{}).name || 'This exercise';
  const dayLabel = DAY_LABELS[dayKey] || 'this day';
  chooseAction(
    `${name} is in this workout. Add it to your ${dayLabel} split for next time? It stays in this workout either way.`,
    'Add to Split',
    ()=> commitExerciseToSplit(log, exerciseId),
    'Only this workout',
    ()=> showToast('Kept for this workout only')
  );
}
function removeExerciseFromActiveWorkout(log, exerciseId){
  if(!log || !Array.isArray(log.plan)) return;
  const ex = getExercise(exerciseId);
  const name = ex ? ex.name : 'this exercise';
  const logged = setsInLogFor(log, exerciseId).length;
  const message = logged
    ? `Remove ${name} from this workout? Sets already logged stay in today’s history. Your split is left as it is.`
    : `Remove ${name} from this workout? Your split is left as it is.`;
  confirmAction(message, 'Remove', ()=>{
    const row = log.plan.find(r=>r.exerciseId===exerciseId);
    log.plan = log.plan.filter(r=>r.exerciseId!==exerciseId);
    dissolveTinySupersets(log.plan);
    if(row && !row.sessionOnly){
      if(!Array.isArray(log.hiddenExerciseIds)) log.hiddenExerciseIds = [];
      if(!log.hiddenExerciseIds.includes(exerciseId)) log.hiddenExerciseIds.push(exerciseId);
    }
    saveData(DATA);
    showToast('Removed from this workout');
    renderApp();
  });
}
function queueExerciseForToday(exerciseId){
  const log = todayLog();
  if(log.active){
    homeScreen = 'workout';
    VIEW = 'today';
    addExerciseToActiveWorkout(exerciseId);
    return;
  }
  persistLog(log);
  const dayKey = weekdayKey();
  if(!Array.isArray(log.queued)) log.queued = [];
  const inSplit = exerciseInSplit(dayKey, exerciseId);
  const queued = log.queued.some(r=>r.exerciseId===exerciseId);
  if(inSplit || queued){ showToast("Already in today's plan"); return; }
  const row = newPlanRow(exerciseId,{goal:DATA.settings.goal});
  row.sessionOnly = true;
  log.queued.push(row);
  saveData(DATA);
  showToast('Added for today only — not on your split');
  renderApp();
}
function setsInLogFor(log, exerciseId){ return log.sets.filter(s=>s.exerciseId===exerciseId); }
function workingSetsInLogFor(log, exerciseId){ return log.sets.filter(s=>s.exerciseId===exerciseId && !s.isWarmup); }

/* Groups plan rows for display. Rows sharing a supersetId are gathered into
   one visual group (in the order they first appear); everything else is
   its own single-row group. A row has one supersetId, so it can never
   belong to two groups at once. */
function groupPlanRows(rows){
  const groups = []; const seen = new Set();
  rows.forEach((row, idx)=>{
    if(seen.has(idx)) return;
    if(row.supersetId){
      const members = [];
      rows.forEach((r2,idx2)=>{ if(r2.supersetId===row.supersetId){ members.push({row:r2, idx:idx2}); seen.add(idx2); } });
      groups.push({type:'superset', supersetId:row.supersetId, members});
    } else {
      groups.push({type:'single', row, idx});
      seen.add(idx);
    }
  });
  return groups;
}
/* Sessions (a date + that date's sets) for one exercise, newest first. */
function recentSessions(exerciseId, count=3, opts){
  const before = opts && opts.before;
  const byDate = new Map();
  loggedSetsForExercise(exerciseId).forEach(set=>{
    if(before && set.date>=before) return;
    if(!byDate.has(set.date)) byDate.set(set.date, []);
    byDate.get(set.date).push(set);
  });
  return [...byDate.entries()]
    .sort((a,b)=> b[0].localeCompare(a[0]))
    .slice(0, count)
    .map(([date,sets])=>({date, sets}));
}
function lastCompletedWorkout(){
  return [...DATA.logs].filter(l=>l.sets.length>0).sort((a,b)=> b.date.localeCompare(a.date))[0] || null;
}

function sortedBodyWeight(){
  return [...(DATA.bodyWeight||[])].sort((a,b)=> b.date.localeCompare(a.date) || (b.id||'').localeCompare(a.id||''));
}
function latestBodyWeight(){ return sortedBodyWeight()[0] || null; }
function bodyWeightOn(date){ return (DATA.bodyWeight||[]).find(e=>e.date===date) || null; }
function isWeighInDay(){ return weekdayKey() === (DATA.settings.weighInDay || 'mon'); }
function shouldShowWeightReminder(){
  if(!isWeighInDay()) return false;
  if(DATA.settings.weightReminderSnoozedOn === todayKey()) return false;
  if(bodyWeightOn(todayKey())) return false;
  return true;
}
function snoozeWeightReminder(){
  DATA.settings.weightReminderSnoozedOn = todayKey();
  saveData(DATA);
}
function saveBodyWeightEntry(weight, note, date){
  date = date || todayKey();
  const existing = bodyWeightOn(date);
  if(existing){
    existing.weight = weight;
    existing.note = note || '';
  } else {
    DATA.bodyWeight.push({id:uid(), date, weight, note:note||''});
  }
  if(date === todayKey()) DATA.settings.weightReminderSnoozedOn = todayKey();
  saveData(DATA);
}
function deleteBodyWeightEntry(id){
  DATA.bodyWeight = (DATA.bodyWeight||[]).filter(e=>e.id!==id);
  saveData(DATA);
}

/* --- today's load plan (accept / defer / adjust an overload suggestion) ---
   One small record per exercise, date-stamped so it self-expires. */
function loadPlanFor(exerciseId){
  const entry = DATA.progress[exerciseId];
  return (entry && entry.date===todayKey()) ? entry : null;
}
function setLoadPlan(exerciseId, patch){
  DATA.progress[exerciseId] = {date:todayKey(), weight:null, deferred:false, ...(loadPlanFor(exerciseId)||{}), ...patch};
  saveData(DATA);
}
function clearLoadPlan(exerciseId){ delete DATA.progress[exerciseId]; saveData(DATA); }

/* ======================== §5 TRAINING RULES ========================
   Everything that decides "how good was that set" and "what next" lives
   here. No DOM access in this section. */

/* --- raw set maths --- */
function estimateOneRepMax(weight, reps){
  const r = Math.min(Math.max(reps||0, 0), 10);
  return (weight||0) * (1 + r/30);
}
function setVolumeLoad(set){
  if(set.isDropSet){
    return (set.stages||[]).reduce((sum,st)=> sum + ((typeof st.weight==='number' && typeof st.reps==='number') ? st.weight*st.reps : 0), 0);
  }
  return (typeof set.weight==='number' && typeof set.reps==='number') ? set.weight*set.reps : 0;
}
function betterIsHigher(metric){ return metric!=='assisted'; }
/* One comparable number per set, used for PRs and charts. */
function setPerformanceScore(set, metric){
  if(metric==='weight_reps') return estimateOneRepMax(set.weight, set.reps);
  if(metric==='reps_only')   return set.reps||0;
  if(metric==='time')        return set.duration||0;
  if(metric==='assisted')    return (set.weight||0) / (1 + (set.reps||0)/30); // less assistance = better
  return 0;
}

/* --- rep ranges & effective sets (the fatigue metric) ---
   effective sets = rep-range credit × effort factor.
   A 10-rep set taken near failure = 1.0. A 4-rep heavy single-ish set counts
   0.5 toward hypertrophy but 1.0 toward strength. An easy set counts half. */
function repRangeFor(reps){
  return TRAINING.repRanges.find(r=>reps<=r.maxReps) || TRAINING.repRanges[TRAINING.repRanges.length-1];
}
function isLowRepSet(set, metric){
  // Warm-ups are exempt: fewer than the working-set floor is normal while ramping up.
  if(!set || set.isWarmup) return false;
  return (metric==='weight_reps' || metric==='assisted') && (set.reps||0) > 0 && set.reps < TRAINING.lowRepWarningBelow;
}
function effectiveSetsFor(set, exercise){
  if(set.isWarmup) return 0;
  const metric = metricOf(exercise);
  const goalKey = goalConfig().key;
  let credit;
  if(set.isDropSet){
    const topReps = (set.stages && set.stages[0] && (set.stages[0].reps||0)) || 0;
    credit = metric==='time' ? TRAINING.timedHoldCredit : repRangeFor(topReps).credit[goalKey];
  } else if(metric==='time') credit = TRAINING.timedHoldCredit;
  else credit = repRangeFor(set.reps||0).credit[goalKey];
  if(!set.isDropSet && set.intent==='strength' && goalKey==='hypertrophy') credit = Math.min(credit, TRAINING.strengthIntentCredit);
  const effort = TRAINING.effortFactor[set.difficulty] != null ? TRAINING.effortFactor[set.difficulty] : 0.85;
  return credit * effort;
}
/* Per-muscle work for a list of sets. Secondary muscles bank a half share. */
function muscleWorkForSets(sets){
  const byMuscle = {};
  const add = (muscle, eff, vol)=>{
    const row = (byMuscle[muscle] ||= {muscle, effectiveSets:0, volumeLoad:0});
    row.effectiveSets += eff; row.volumeLoad += vol;
  };
  sets.forEach(set=>{
    const ex = getExercise(set.exerciseId); if(!ex) return;
    const eff = effectiveSetsFor(set, ex), vol = setVolumeLoad(set);
    add(primaryOf(ex), eff, vol);
    secondaryOf(ex).forEach(m=> add(m, eff*TRAINING.secondaryMuscleShare, vol*TRAINING.secondaryMuscleShare));
  });
  return Object.values(byMuscle).sort((a,b)=> b.effectiveSets - a.effectiveSets);
}
function totalEffectiveSets(sets){
  return sets.reduce((sum,set)=>{
    const ex = getExercise(set.exerciseId);
    return ex ? sum + effectiveSetsFor(set, ex) : sum;
  }, 0);
}
function sessionEffortSummary(sets){
  if(!sets.length) return {avg:2, label:'medium effort', mostlyEasy:false, mostlyHard:false};
  const avg = sets.reduce((sum,s)=>sum+(EFFORT_SCORE[s.difficulty]||2),0)/sets.length;
  const mostlyEasy = avg<=1.4, mostlyHard = avg>=2.5;
  return {avg, mostlyEasy, mostlyHard, label: mostlyEasy?'mostly easy':(mostlyHard?'mostly hard':'medium effort')};
}

/* --- personal records --- */
function recomputePRs(exerciseId){
  const ex = getExercise(exerciseId); if(!ex) return;
  const metric = metricOf(ex), higher = betterIsHigher(metric);
  const refs = [];
  DATA.logs.forEach(log=> log.sets.forEach(set=>{ if(set.exerciseId===exerciseId && !set.isDropSet && !set.isWarmup) refs.push({log,set}); }));
  refs.sort((a,b)=> a.log.date===b.log.date ? (a.set.ts-b.set.ts) : a.log.date.localeCompare(b.log.date));
  let best = null;
  refs.forEach(({set})=>{
    const score = setPerformanceScore(set, metric);
    const improved = best===null || (higher ? score>best : score<best);
    set.isPR = improved;
    if(improved) best = score;
  });
}
/* Chronological PR moments (including the first logged set as the first PR).
   Same scoring as recomputePRs; drop sets excluded. Oldest first. */
function prMomentsForExercise(exerciseId){
  const ex = getExercise(exerciseId); if(!ex) return [];
  const metric = metricOf(ex), higher = betterIsHigher(metric);
  const refs = [];
  DATA.logs.forEach(log=> log.sets.forEach(set=>{
    if(set.exerciseId===exerciseId && !set.isDropSet && !set.isWarmup) refs.push({date:log.date, set});
  }));
  refs.sort((a,b)=> a.date===b.date ? ((a.set.ts||0)-(b.set.ts||0)) : a.date.localeCompare(b.date));
  let best = null;
  const moments = [];
  refs.forEach(({date,set})=>{
    const score = setPerformanceScore(set, metric);
    if(best===null || (higher ? score>best : score<best)){
      best = score;
      moments.push({date, set, score});
    }
  });
  return moments;
}
function exercisesWithPrs(muscle){
  return DATA.exercises.filter(e=>primaryOf(e)===muscle && prMomentsForExercise(e.id).length).sort(compareExercises);
}
function appHasAnyPrs(){ return DATA.exercises.some(e=>prMomentsForExercise(e.id).length>0); }

/* --- progressive overload ---------------------------------------------
   Gradual by design: you must repeat a qualifying session before the app
   asks for more load, and the ask is a suggestion the user accepts,
   defers or adjusts (see §9 openLoadAdjustSheet).

   A session qualifies when, at the same load or better:
     · at least `qualifyingSets` sets reached `repsTarget` reps, and
     · average effort is at most maxEffortToQualify (one Hard set is ok).
   repsTarget = the programmed row's own top rep (planRow.repsMax). */
function roundToPlate(weight){
  const step = TRAINING.load.plateStepKg;
  return Math.round(weight/step)*step;
}
function nextLoadFor(exercise, currentWeight){
  const pct = LOWER_BODY_MUSCLES.has(primaryOf(exercise)) ? TRAINING.load.increasePctLower : TRAINING.load.increasePctUpper;
  const byEquip = TRAINING.load.minIncrementByEquip || {};
  const minInc = byEquip[equipOf(exercise)] != null ? byEquip[equipOf(exercise)] : TRAINING.load.minIncrementKg;
  if(minInc<=0) return currentWeight;
  const raw = currentWeight * pct/100;
  const step = TRAINING.load.plateStepKg;
  const bump = Math.max(minInc, raw);
  return Math.round((currentWeight + bump)/step)*step;
}
function mostCommonWeight(sets, assisted){
  const freq = {};
  sets.forEach(s=>{ const w=s.weight||0; freq[w]=(freq[w]||0)+1; });
  const rows = Object.keys(freq).map(k=>({w:+k, n:freq[k]}));
  rows.sort((a,b)=> b.n-a.n || (assisted ? a.w-b.w : b.w-a.w));
  return rows[0] ? rows[0].w : 0;
}
function sessionQualifiesForIncrease(session, referenceWeight, repsTarget, setsNeeded, assisted){
  const good = session.sets.filter(set=>{
    if(set.isDropSet || set.isWarmup) return false;
    const weightOK = assisted ? (set.weight||0) <= referenceWeight+0.01 : (set.weight||0) >= referenceWeight-0.01;
    return weightOK && (set.reps||0) >= repsTarget;
  });
  if(good.length < setsNeeded) return false;
  const avgEffort = good.reduce((sum,s)=>sum+(EFFORT_SCORE[s.difficulty]||2),0)/good.length;
  return avgEffort <= TRAINING.load.maxEffortToQualify;
}

const FIRST_SESSION_COPY = {
  weight_reps:'No history yet — pick a weight you can control for the full rep range, then log it.',
  reps_only:'No history yet — do as many clean reps as you can, then log it.',
  time:'No history yet — hold as long as you can with good form, then log it.',
  assisted:'No history yet — pick an assistance level that lets you complete the reps, then log it.'
};

/* Returns everything the UI needs to describe "what should I do today?".
   state: no_history | build | ready | accepted | deferred */
function progressionFor(exerciseId, planRow){
  const ex = getExercise(exerciseId);
  const metric = metricOf(ex);
  const goal = goalConfig();
  const repsMin = planRow ? planRow.repsMin : goal.repsMin;
  const repsMax = planRow ? planRow.repsMax : goal.repsMax;
  const status = {exerciseId, metric, repsMin, repsMax, state:'build',
    headline:'', note:null, lastLine:null, progressText:null,
    referenceWeight:null, suggestedWeight:null, targetWeight:null,
    qualifyingSessions:0, sessionsRequired:goal.sessionsRequired, repsTarget:null};

  const sessions = recentSessions(exerciseId, 4, {before:todayKey()});
  if(!sessions.length){
    status.state = 'no_history';
    status.headline = FIRST_SESSION_COPY[metric];
    return status;
  }
  const last = sessions[0];
  const lastNormal = last.sets.filter(s=>!s.isDropSet && !s.isWarmup);
  const effort = sessionEffortSummary(lastNormal.length ? lastNormal : last.sets);
  status.lastLine = `Last: ${last.sets.map(s=>setValueText(s,metric)).join(', ')} · felt ${effort.label}`;

  if(!lastNormal.length){
    status.headline = 'Logged as a drop set last time — no straight-set progression to suggest.';
    status.note = 'Log a normal set to get a load suggestion.';
    return status;
  }

  /* bodyweight reps and timed holds progress by reps/seconds, not load */
  if(metric==='reps_only' || metric==='time'){
    const key = metric==='time' ? 'duration' : 'reps';
    const best = Math.max(...lastNormal.map(s=>s[key]||0));
    const step = metric==='time' ? (effort.mostlyEasy?15:10) : (effort.mostlyEasy?2:1);
    const target = effort.mostlyHard ? best : best+step;
    status.headline = metric==='time' ? `Try holding for ${target}s` : `Try for ${target} reps`;
    status.note = effort.mostlyHard ? 'That was tough — match it and hold your form.'
      : effort.mostlyEasy ? 'Felt easy — push for more this time.' : 'Good session — add a little.';
    return status;
  }

  const assisted = metric==='assisted';
  const referenceWeight = mostCommonWeight(lastNormal, assisted);
  const repsTarget = repsMax;
  const setsNeeded = Math.min(goal.qualifyingSets, planRow ? planRow.sets : goal.qualifyingSets);
  status.referenceWeight = referenceWeight;
  status.repsTarget = repsTarget;

  let qualifying = 0;
  for(const session of sessions){
    if(sessionQualifiesForIncrease(session, referenceWeight, repsTarget, setsNeeded, assisted)) qualifying++;
    else break;
  }
  status.qualifyingSessions = qualifying;

  if(qualifying >= goal.sessionsRequired){
    status.state = 'ready';
    if(assisted && referenceWeight<=0){
      status.suggestedWeight = 0;
      status.headline = 'Assistance is already 0 — add reps, or change this exercise to bodyweight reps in the library.';
      status.note = `${qualifying} clean session${qualifying>1?'s':''} at 0${units()} assist.`;
    } else {
      status.suggestedWeight = assisted
        ? Math.max(0, roundToPlate(referenceWeight - TRAINING.load.assistanceStepKg))
        : nextLoadFor(ex, referenceWeight);
      status.headline = assisted
        ? `Ready to drop assistance: ${referenceWeight} → ${status.suggestedWeight}${units()}`
        : `Ready to add load: ${referenceWeight} → ${status.suggestedWeight}${units()}`;
      status.note = `${qualifying} clean session${qualifying>1?'s':''} at ${referenceWeight}${units()} × ${repsTarget}+ reps.`;
    }
  } else {
    const bestReps = Math.max(...lastNormal.map(s=>s.reps||0));
    status.headline = assisted
      ? `Stay at ${referenceWeight}${units()} assist for ${repsMin}–${repsMax} reps`
      : `Stay at ${referenceWeight}${units()} for ${repsMin}–${repsMax} reps`;
    status.note = effort.mostlyHard ? 'That one felt hard — hold the load and chase one more rep.'
      : bestReps < repsTarget ? `Add reps first — ${setsNeeded} sets at ${repsTarget}+ reps unlocks more weight.`
      : (qualifying+1 >= goal.sessionsRequired)
        ? `One more session like that and you've earned the increase.`
        : `Need ${goal.sessionsRequired-qualifying} more clean session${goal.sessionsRequired-qualifying>1?'s':''} at ${repsTarget}+ reps.`;
    status.progressText = `Overload progress: ${qualifying}/${goal.sessionsRequired} qualifying sessions`;
  }

  /* user's own decision for today wins over the suggestion */
  const plan = loadPlanFor(exerciseId);
  if(plan && typeof plan.weight === 'number'){
    status.state = 'accepted';
    status.targetWeight = plan.weight;
    status.headline = `Today's target: ${plan.weight}${units()}${assisted?' assist':''} × ${repsMin}–${repsMax} reps`;
    status.note = null;
  } else if(plan && plan.deferred){
    status.state = 'deferred';
    status.headline = `Holding ${referenceWeight}${units()}${assisted?' assist':''} today — we'll ask again next session.`;
    status.note = null;
  }
  return status;
}

/* --- alternatives / variations ---------------------------------------
   Scored against the source movement; anything with no muscle overlap
   scores zero and is never shown. */
function patternFamily(pattern){ return PATTERN_FAMILY[pattern] || 'other'; }
function alternativeScore(source, candidate){
  const reasons = [];
  let score = 0;
  const srcSecondary = secondaryOf(source), candSecondary = secondaryOf(candidate);
  const srcMuscle = primaryOf(source), candMuscle = primaryOf(candidate);

  if(srcMuscle === candMuscle){ score += 50; reasons.push(`Same primary muscle (${srcMuscle})`); }
  else if(candSecondary.includes(srcMuscle)){ score += 20; reasons.push(`Still trains ${srcMuscle}`); }
  else if(srcSecondary.includes(candMuscle) && candSecondary.some(m=>srcSecondary.includes(m))){ score += 12; reasons.push('Overlapping muscles'); }
  else return {score:0, reasons:[]};

  const srcPattern = patternOf(source), candPattern = patternOf(candidate);
  if(srcPattern===candPattern && srcPattern!=='other'){ score += 30; reasons.push(`Same ${PATTERN_LABELS[srcPattern]} pattern`); }
  else if(patternFamily(srcPattern)===patternFamily(candPattern) && patternFamily(srcPattern)!=='other'){ score += 14; reasons.push('Similar movement pattern'); }

  if(tierOf(source)===tierOf(candidate)) score += 10;
  score += Math.min(9, candSecondary.filter(m=>srcSecondary.includes(m)).length * 3);

  if(equipOf(source)===equipOf(candidate)) score += 6;
  else { score += 3; reasons.push(`${equipLabel(candidate)} version`); }

  score += metricOf(source)===metricOf(candidate) ? 5 : -4;
  if(hasHistory(candidate.id)){ score += 4; reasons.push('You have history with this one'); }
  return {score, reasons:reasons.slice(0,3)};
}
function alternativesFor(exerciseId, opts){
  opts = opts || {};
  const source = getExercise(exerciseId);
  if(!source) return [];
  const skip = new Set(opts.exclude || []); skip.add(exerciseId);
  return DATA.exercises
    .filter(e=>!skip.has(e.id))
    .map(e=>({ex:e, ...alternativeScore(source, e)}))
    .filter(c=>c.score>0)
    .sort((a,b)=> b.score-a.score || compareExercises(a.ex,b.ex))
    .slice(0, opts.limit || 5);
}
function alternativeReason(alt){ return alt.reasons.length ? alt.reasons.join(' · ') : `Also trains ${primaryOf(alt.ex)}`; }

/* --- consistency & weekly totals --- */
function currentStreakDays(){
  let streak = 0;
  const cursor = new Date();
  for(let i=0;i<400;i++){
    const day = splitDays()[weekdayKey(cursor)];
    const isRestDay = !day || day.exercises.length===0;
    const log = DATA.logs.find(l=>l.date===dateKey(cursor));
    const trained = !!(log && log.sets.length);
    if(i===0 && !trained){ cursor.setDate(cursor.getDate()-1); continue; } // today doesn't break it yet
    if(isRestDay || trained){ if(trained && !isRestDay) streak++; cursor.setDate(cursor.getDate()-1); continue; }
    break;
  }
  return streak;
}
function weeklyVolumeLoad(weeksAgo=0){
  const end = new Date(); end.setHours(0,0,0,0); end.setDate(end.getDate() - weeksAgo*7 + 1);
  const start = new Date(end); start.setDate(end.getDate()-7);
  const from = dateKey(start), to = dateKey(end);
  let total = 0;
  DATA.logs.forEach(log=>{ if(log.date>=from && log.date<to) log.sets.forEach(s=>{ total += setVolumeLoad(s); }); });
  return total;
}
function workoutElapsedMs(log, now){
  if(!log) return 0;
  const base = (typeof log.elapsedMs==='number' && isFinite(log.elapsedMs)) ? Math.max(0, log.elapsedMs) : 0;
  if(!log.timerRunningSince) return base;
  return base + Math.max(0, (now||Date.now()) - log.timerRunningSince);
}
function sessionDurationMs(log){
  if(!log || !log.startedAt) return null;
  if(log.active || typeof log.elapsedMs==='number') return workoutElapsedMs(log);
  if(!log.endedAt) return null;
  return Math.max(0, log.endedAt - log.startedAt);
}

/* ============================ §6 FORMAT ============================ */
function setValueText(set, metric){
  if(set.isDropSet) return dropSetSummaryText(set, metric);
  if(metric==='weight_reps') return `${set.weight}${units()} × ${set.reps}`;
  if(metric==='reps_only')   return `${set.reps} reps`;
  if(metric==='time')        return `${set.duration}s`;
  if(metric==='assisted')    return `${set.weight}${units()} assist × ${set.reps}`;
  return '';
}
function formatPrValue(set, metric){
  if(metric==='weight_reps') return `${set.weight} kg × ${set.reps}`;
  if(metric==='reps_only')   return `${set.reps} reps`;
  if(metric==='time')        return `${set.duration} s`;
  if(metric==='assisted')    return `${set.weight} kg`;
  return setValueText(set, metric);
}
function formatPrMomentLine(moment, metric){
  return `${formatLogDate(moment.date)}: ${formatPrValue(moment.set, metric)} PR`;
}
function stageValueText(stage, metric){
  if(metric==='weight_reps') return `${stage.weight}${units()}×${stage.reps}`;
  if(metric==='reps_only')   return `${stage.reps} reps`;
  if(metric==='time')        return `${stage.duration}s`;
  if(metric==='assisted')    return `${stage.weight}${units()} assist×${stage.reps}`;
  return '';
}
function dropSetSummaryText(set, metric){
  return (set.stages||[]).map(st=>stageValueText(st, metric)).join(' → ');
}
function defaultDropStages(metric, prefillWeight){
  const base = ()=>{
    if(metric==='weight_reps' || metric==='assisted') return {weight: prefillWeight!=null?prefillWeight:'', reps:''};
    if(metric==='reps_only') return {reps:''};
    if(metric==='time') return {duration:''};
    return {};
  };
  return [base(), base()];
}
function stageFieldsHtml(metric, stage, idx){
  if(metric==='weight_reps' || metric==='assisted'){
    const label = metric==='assisted' ? 'Assist' : 'Weight';
    return `<input type="number" step="0.5" min="0" inputmode="decimal" placeholder="${label}" value="${stage.weight!=null?stage.weight:''}" data-stage-weight="${idx}" style="flex:1;min-width:0;">
            <input type="number" min="0" inputmode="numeric" placeholder="Reps" value="${stage.reps!=null?stage.reps:''}" data-stage-reps="${idx}" style="flex:1;min-width:0;">`;
  }
  if(metric==='reps_only') return `<input type="number" min="0" inputmode="numeric" placeholder="Reps" value="${stage.reps!=null?stage.reps:''}" data-stage-reps="${idx}" style="flex:1;min-width:0;">`;
  if(metric==='time') return `<input type="number" min="0" inputmode="numeric" placeholder="Seconds" value="${stage.duration!=null?stage.duration:''}" data-stage-secs="${idx}" style="flex:1;min-width:0;">`;
  return '';
}
function readStageFields(metric, root, idx){
  if(metric==='weight_reps' || metric==='assisted'){
    const w = q(`[data-stage-weight="${idx}"]`,root), r = q(`[data-stage-reps="${idx}"]`,root);
    const weight = parseFloat(w.value), reps = parseInt(r.value,10);
    if(isNaN(weight)||isNaN(reps)||weight<0||reps<=0) return null;
    return {weight, reps};
  }
  if(metric==='reps_only'){
    const r = q(`[data-stage-reps="${idx}"]`,root);
    const reps = parseInt(r.value,10);
    return (isNaN(reps)||reps<=0) ? null : {reps};
  }
  if(metric==='time'){
    const s = q(`[data-stage-secs="${idx}"]`,root);
    const duration = parseInt(s.value,10);
    return (isNaN(duration)||duration<=0) ? null : {duration};
  }
  return {};
}
function effortLabel(key){ return EFFORT_LABELS[key] || key; }
function effortClass(key){ return key==='easy' ? 'diff-easy' : (key==='hard' ? 'diff-hard' : 'diff-mid'); }
function formatDuration(ms){
  if(!ms || ms<0) return '—';
  const minutes = Math.round(ms/60000), h = Math.floor(minutes/60), m = minutes%60;
  return h>0 ? `${h}h ${m}m` : `${m} min`;
}
function formatWorkoutClock(ms){
  const total = Math.max(0, Math.floor((ms||0)/1000));
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  const ss = String(s).padStart(2,'0');
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${m}:${ss}`;
}
function formatLogDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return `${d.getDate()} ${d.toLocaleDateString(undefined,{month:'short'})} ${d.toLocaleDateString(undefined,{weekday:'short'})}`;
}
const BODY_WEIGHT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
function formatBodyWeightDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return `${d.getDate()} ${BODY_WEIGHT_MONTHS[d.getMonth()]} ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}`;
}
function formatBodyWeightKg(weight){
  const n = Number(weight);
  if(!Number.isFinite(n)) return '—';
  return Number.isInteger(n) ? String(n) : String(roundTo(n,1));
}
function formatBodyWeightLine(entry){
  return `${formatBodyWeightDate(entry.date)}: ${formatBodyWeightKg(entry.weight)} kg`;
}
function relativeDay(dateStr){
  const days = Math.round((new Date(todayKey()+'T00:00:00') - new Date(dateStr+'T00:00:00'))/86400000);
  if(days===0) return 'Today';
  if(days===1) return 'Yesterday';
  if(days<7) return `${days} days ago`;
  return formatLogDate(dateStr);
}
function roundTo(value, dp=1){ const f=Math.pow(10,dp); return Math.round(value*f)/f; }
function quoteOfTheDay(){
  let hash = 0; const key = todayKey();
  for(let i=0;i<key.length;i++) hash = (hash*31 + key.charCodeAt(i))>>>0;
  return MOTIVATIONAL_QUOTES[hash % MOTIVATIONAL_QUOTES.length];
}
function greetingText(name){
  const h = new Date().getHours();
  if(h<5)  return `Still up, ${name}?`;
  if(h<12) return `Good morning, ${name}`;
  if(h<17) return `Good afternoon, ${name}`;
  if(h<21) return `Good evening, ${name}`;
  return `Late one, ${name}?`;
}
function appreciationLine(totalSets, prCount){
  const name = DATA.settings.userName || 'there';
  if(prCount>0)      return `🏆 ${prCount} new PR${prCount>1?'s':''} today — great session, ${name}!`;
  if(totalSets>=15)  return `Huge effort — you crushed ${totalSets} sets today!`;
  if(totalSets>=8)   return `Great session! You crushed ${totalSets} sets today.`;
  if(totalSets>0)    return `Nice work getting ${totalSets} set${totalSets>1?'s':''} in today.`;
  return `Session logged — every bit of movement counts.`;
}

const SHEET_ROOT = {main:'modalRoot', picker:'pickerRoot', form:'formRoot'};
let overlayStack = 0;
let ignoreHistoryPop = false;
function overlayIsOpen(){
  const confirm = document.getElementById('confirmRoot');

function capacitorAppPlugin(){
  try{ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App; }
  catch(_){ return null; }

function pushOverlayHistory(){
  overlayStack++;
  if(capacitorAppPlugin()) return;
  try{ history.pushState({overlay:APP_NAME, n:overlayStack}, ''); }catch(_){}

function popOverlayHistory(){
  if(overlayStack<=0) return;
  overlayStack--;

  try{ history.back(); }catch(_){}

function closeTopOverlay(){
  const confirm = document.getElementById('confirmRoot');
  if(confirm && confirm.innerHTML.trim()){ confirm.innerHTML=''; return true; }
  const order = [SHEET_ROOT.form, SHEET_ROOT.picker, SHEET_ROOT.main];
  for(const id of order){
    const root = document.getElementById(id);

  }

function openSheet(opts){
  const root = document.getElementById(opts.root || SHEET_ROOT.main);
  const bgStyle = `${opts.zIndex?`z-index:${opts.zIndex};`:''}${opts.centered?'align-items:center;':''}`;
  const boxStyle = opts.centered ? 'border-radius:18px;max-width:380px;width:88%;animation:none;' : '';
  const node = el(`
    <div class="modal-bg" style="${bgStyle}">
      <div class="modal" style="${boxStyle}">
        ${opts.title!=null ? `<div class="modal-top">
            <div class="row" style="min-width:0;">

            <button class="close-x" data-close aria-label="Close">${icon('x',18)}</button>
          </div>` : ''}
        <div data-body></div>
      </div>
    </div>`);
  const sheet = {
    root, node, body:q('[data-body]',node),
    close(){
      root.innerHTML='';
      if(opts.onClosed) opts.onClosed();
      if(!ignoreHistoryPop) popOverlayHistory();
    }
  };
  const requestClose = ()=> opts.onRequestClose ? opts.onRequestClose(sheet) : sheet.close();
  const closeBtn = q('[data-close]',node); if(closeBtn) closeBtn.onclick = requestClose;
  const backBtn  = q('[data-back]',node);  if(backBtn)  backBtn.onclick  = ()=> opts.onBack(sheet);
  node.onclick = (e)=>{ if(e.target===node) requestClose(); };
  const replacing = !!(root.innerHTML && root.innerHTML.trim());
  root.innerHTML=''; root.appendChild(node);
  if(!replacing) pushOverlayHistory();
  if(opts.build) opts.build(sheet.body, sheet);
  return sheet;
}

  Object.values(SHEET_ROOT).forEach(id=>{ document.getElementById(id).innerHTML=''; });

    ignoreHistoryPop = true;

    setTimeout(()=>{ ignoreHistoryPop = false; }, 120);
  }
}

/* --- rest timer -------------------------------------------------------
   Countdown UI is in-memory (restTimers). The PRIMARY rest-end alert is a
   native system notification scheduled when rest STARTS, so Android can
   still show a heads-up banner if you leave for Instagram or lock the
   phone. JS toasts/haptics are secondary and only run if this WebView
   is still alive.

   Limitations (web / Capacitor):
   - Heads-up banners need @capacitor/local-notifications, a HIGH
     importance channel, POST_NOTIFICATIONS (Android 13+), and the user
     tapping Allow. A plain browser tab cannot overlay other apps.
   - Do not set channel sound to a raw filename. Android 8+ treats a
     missing file as "App provided" and plays nothing. Omit sound so the
     channel keeps the system default notification sound.
   - Android will not update an existing channel. REST_NOTIFY_CHANNEL is
     versioned; the previous silent channel is deleted on launch.
   - On-time delivery needs exact alarms (Alarms & reminders). Some phones
     also delay alarms until Battery is Unrestricted. The app asks when it
     can; the manual steps live in Settings, plus one dismissible sheet. */
const REST_NOTIFY_CHANNEL = 'rest-heads-up-v2';
const REST_NOTIFY_CHANNEL_OLD = 'rest-heads-up-v1';
const WORKOUT_REST_ID = 'workout';
const restTimers = {}; // WORKOUT_REST_ID -> {end, seconds, name}
let restTicker = null;

function restNotificationsAvailable(){ return !!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications); }
function hapticsAvailable(){ return !!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics); }
function restNotificationId(exerciseId){
  let h = 0; for(let i=0;i<exerciseId.length;i++) h = (h*31 + exerciseId.charCodeAt(i)) | 0;
  return Math.abs(h) % 2000000000;
}
function restNotifyCopy(exerciseName){
  const title = 'Rest complete';
  const body = exerciseName
    ? `Rest complete – ready for your next set of ${exerciseName}`
    : 'Rest complete – ready for your next set';
  return {title, body};
}
function isAndroidApp(){
  try{ return !!(window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform()==='android'); }
  catch(_){ return false; }
}
function batteryOptimizationPlugin(){
  try{
    const plugins = window.Capacitor && window.Capacitor.Plugins;
    return (plugins && plugins.BatteryOptimization) || null;
  }catch(_){ return null; }
}
async function ensureRestNotifyChannel(){
  if(!restNotificationsAvailable()) return;
  const LN = window.Capacitor.Plugins.LocalNotifications;
  try{ if(LN.deleteChannel) await LN.deleteChannel({id: REST_NOTIFY_CHANNEL_OLD}); }catch(_){}
  try{
    /* No sound field: NotificationChannel then uses the system default. */
    await LN.createChannel({
      id: REST_NOTIFY_CHANNEL,
      name: 'Rest complete',
      description: 'Alert when rest ends, including over other apps',
      importance: 5,
      visibility: 1,
      vibration: true,
      lights: true
    });
  }catch(err){ console.error(APP_NAME+': could not create notification channel', err); }
}
async function exactAlarmStatus(){
  if(!restNotificationsAvailable()) return 'unknown';
  const LN = window.Capacitor.Plugins.LocalNotifications;
  if(!LN.checkExactNotificationSetting) return 'unknown';
  try{
    const status = await LN.checkExactNotificationSetting();
    if(!status || !status.exact_alarm) return 'unknown';
    return status.exact_alarm==='granted' ? 'granted' : 'denied';
  }catch(_){ return 'unknown'; }
}
async function requestExactAlarm(){
  const LN = restNotificationsAvailable() && window.Capacitor.Plugins.LocalNotifications;
  if(!LN || !LN.changeExactNotificationSetting) return exactAlarmStatus();
  try{
    const status = await LN.changeExactNotificationSetting();
    if(status && status.exact_alarm) return status.exact_alarm==='granted' ? 'granted' : 'denied';
  }catch(_){}
  return exactAlarmStatus();
}
async function batteryOptimizationState(){
  const plugin = batteryOptimizationPlugin();
  if(!plugin || typeof plugin.isBatteryOptimizationEnabled!=='function') return 'unavailable';
  try{
    const res = await plugin.isBatteryOptimizationEnabled();
    return res && res.enabled ? 'restricted' : 'unrestricted';
  }catch(_){ return 'unavailable'; }
}
async function requestBatteryUnrestricted(){
  const plugin = batteryOptimizationPlugin();
  if(!plugin || typeof plugin.requestIgnoreBatteryOptimization!=='function') return batteryOptimizationState();
  try{ await plugin.requestIgnoreBatteryOptimization(); }catch(_){}
  return batteryOptimizationState();
}
function rescheduleActiveRestNotifications(){
  Object.keys(restTimers).forEach(id=>{
    const t = restTimers[id];
    if(!t) return;
    scheduleRestNotification(id, Math.max(1, Math.round((t.end-Date.now())/1000)), t.name);
  });
}
let restSetupRunning = false;
async function runRestAlertSetup(opts){
  if(restSetupRunning) return null;
  restSetupRunning = true;
  const quiet = !!(opts && opts.quiet);
  try{
    const ok = await ensureRestNotifyPermission();
    if(!ok){
      if(!quiet) showToast('Notifications are blocked for '+APP_NAME+' in your phone settings');
      return {ok:false};
    }
    let exact = await exactAlarmStatus();
    if(exact==='denied') exact = await requestExactAlarm();
    let battery = await batteryOptimizationState();
    if(battery==='restricted') battery = await requestBatteryUnrestricted();
    if(exact!=='denied') rescheduleActiveRestNotifications();
    if(!quiet){
      if(exact==='denied') showToast('Turn on Alarms & reminders for '+APP_NAME+' so rest fires on time');
      else if(battery==='restricted') showToast('Set Battery to Unrestricted for '+APP_NAME);
      else if(isAndroidApp() && battery==='unavailable') showToast('If rest is late with the screen off, set Battery to Unrestricted');
      else showToast('Rest alerts are allowed');
    }
    return {ok:true, exact, battery};
  }finally{ restSetupRunning = false; }
}
function dismissRestBatteryHint(){
  if(DATA.settings.restBatteryHintDismissed) return;
  DATA.settings.restBatteryHintDismissed = true;
  saveData(DATA);
}
function openRestBatteryHint(){
  openSheet({
    title:'Rest alerts',
    onRequestClose(sheet){ dismissRestBatteryHint(); sheet.close(); },
    build(body, sheet){
      body.appendChild(el(`
        <p>Android can delay or silence the rest timer when the screen is off. Allow the prompts for notifications, Alarms &amp; reminders, and unrestricted battery.</p>
        <p class="faint small" style="margin-top:10px;">If no prompt appears, set it once: Settings → Apps → ${escapeHtml(APP_NAME)} → Battery → Unrestricted. Also turn on Alarms &amp; reminders if you see it.</p>
        <button class="btn" data-allow style="width:100%;margin-top:16px;">Allow now</button>
        <button class="btn secondary" data-later style="width:100%;margin-top:8px;">Not now</button>`));
      q('[data-allow]', body).onclick = async ()=>{
        DATA.settings.restSetupAsked = true;
        saveData(DATA);
        await runRestAlertSetup();
        const battery = await batteryOptimizationState();
        if(battery==='unrestricted'){
          dismissRestBatteryHint();
          sheet.close();
        }
      };
      q('[data-later]', body).onclick = ()=>{ dismissRestBatteryHint(); sheet.close(); };
    }
  });
}
function ensureRestAlertsReady(){
  if(!isAndroidApp() || !DATA.settings.restNotify) return;
  const first = !DATA.settings.restSetupAsked;
  if(first){
    DATA.settings.restSetupAsked = true;
    saveData(DATA);
  }
  (async ()=>{
    if(first) await runRestAlertSetup({quiet:true});
    if(DATA.settings.restBatteryHintDismissed) return;
    const battery = await batteryOptimizationState();
    if(battery==='unrestricted') return;
    if(overlayIsOpen()) return;
    openRestBatteryHint();
  })();
}
async function ensureRestNotifyPermission(){
  if(!restNotificationsAvailable()){
    if(!('Notification' in window)) return false;
    try{
      if(Notification.permission==='granted') return true;
      if(Notification.permission==='denied') return false;
      return (await Notification.requestPermission())==='granted';
    }catch(_){ return false; }
  }
  try{
    const {LocalNotifications} = window.Capacitor.Plugins;
    const status = await LocalNotifications.checkPermissions();
    let granted = status.display === 'granted';
    if(!granted){
      const req = await LocalNotifications.requestPermissions();
      granted = req.display === 'granted';
    }
    if(granted) await ensureRestNotifyChannel();
    return granted;
  }catch(err){
    console.error(APP_NAME+': notification permission check failed', err);
    return false;
  }
}
async function scheduleRestNotification(exerciseId, seconds, exerciseName){
  if(!DATA.settings.restNotify) return;
  const {title, body} = restNotifyCopy(exerciseName);
  const waitMs = Math.max(1000, Math.round(seconds*1000));
  if(restNotificationsAvailable()){
    const {LocalNotifications} = window.Capacitor.Plugins;
    const id = restNotificationId(exerciseId);
    const at = new Date(Date.now()+waitMs);
    const exact = await exactAlarmStatus();
    /* Denied exact alarms must not be requested again here: Capacitor 8.3
       opens Alarms & reminders on every exact schedule until the user allows it. */
    const schedule = {at, allowWhileIdle:true, isExactNotification: exact!=='denied'};
    LocalNotifications.cancel({notifications:[{id}]}).catch(()=>{}).finally(()=>{
      LocalNotifications.schedule({notifications:[{
        id,
        title,
        body,
        largeBody: body,
        channelId: REST_NOTIFY_CHANNEL,
        autoCancel: true,
        schedule,
        extra:{ type:'rest', exerciseId }
      }]}).catch(err=> console.error(APP_NAME+': schedule notification failed', err));
    });
    return;
  }
  const t = restTimers[exerciseId];
  if(t && t.webNoteTimer){ clearTimeout(t.webNoteTimer); t.webNoteTimer = null; }
  if(t && 'Notification' in window && Notification.permission==='granted'){
    t.webNoteTimer = setTimeout(()=>{
      try{
        const n = new Notification(title, {body, tag:'trackagain-rest', requireInteraction:true, silent:false, vibrate:[400,120,400]});
        n.onclick = ()=>{ try{ window.focus(); n.close(); }catch(_){ } };
      }catch(_){}
    }, waitMs);
  }
}
function cancelRestNotification(exerciseId){
  const t = restTimers[exerciseId];
  if(t && t.webNoteTimer){ clearTimeout(t.webNoteTimer); t.webNoteTimer = null; }
  if(!restNotificationsAvailable()) return;
  window.Capacitor.Plugins.LocalNotifications.cancel({notifications:[{id:restNotificationId(exerciseId)}]}).catch(()=>{});
}
function vibrateRestEnd(){
  if(!DATA.settings.restVibrate) return;
  if(hapticsAvailable()){
    const H = window.Capacitor.Plugins.Haptics;
    H.vibrate({duration:400}).catch(()=>{});
    setTimeout(()=> H.vibrate({duration:400}).catch(()=>{}), 220);
  } else if(navigator.vibrate) navigator.vibrate([300,120,300,120,400]);
}
function alertRestEndedSecondary(){
  vibrateRestEnd();
  showToast('Rest complete – ready for your next set');
}
function formatMinSec(seconds){
  const m = Math.floor(seconds/60), s = seconds%60;
  return s ? `${m}:${String(s).padStart(2,'0')}` : `${m}m`;
}
function defaultRestSeconds(){ return Math.max(15, Math.round((DATA.settings.restDefaultMinutes||3)*60)); }
function restSecondsFor(planRow){
  if(planRow && planRow.restSeconds===0) return 0;
  return (planRow && typeof planRow.restSeconds==='number') ? planRow.restSeconds : defaultRestSeconds();
}
function restRemainingText(exerciseId){
  const t = restTimers[exerciseId]; if(!t) return '0:00';
  const remain = t.end - Date.now();
  return remain<=0 ? '0:00' : `${Math.floor(remain/60000)}:${String(Math.floor((remain%60000)/1000)).padStart(2,'0')}`;
}
function restProgressPct(exerciseId){
  const t = restTimers[exerciseId]; if(!t) return 0;
  const remain = Math.max(0, t.end - Date.now());
  return Math.max(0, Math.min(100, Math.round((1 - remain/(t.seconds*1000)) * 100)));
}
async function startRestTimer(exerciseId, seconds, exerciseName){
  if(!seconds || seconds<=0) return;
  if(restTimers[exerciseId]) cancelRestNotification(exerciseId);
  restTimers[exerciseId] = {end: Date.now()+seconds*1000, seconds, name: exerciseName};
  if(!restTicker) restTicker = setInterval(tickRestTimers, 250);
  renderApp();
  if(DATA.settings.restNotify){
    const ok = await ensureRestNotifyPermission();
    if(ok) await scheduleRestNotification(exerciseId, seconds, exerciseName);
    else showToast('Allow notifications for '+APP_NAME+' in phone settings so rest can alert you in other apps');
    if(ok) ensureRestAlertsReady();
  }
}
function extendRestTimer(exerciseId, extraSeconds){
  const t = restTimers[exerciseId]; if(!t) return;
  t.end += extraSeconds*1000; t.seconds += extraSeconds;
  if(DATA.settings.restNotify) scheduleRestNotification(exerciseId, Math.max(1, Math.round((t.end-Date.now())/1000)), t.name);
  renderApp();
}
function stopRestTimer(exerciseId){ cancelRestNotification(exerciseId); delete restTimers[exerciseId]; renderApp(); }
function tickRestTimers(){
  const now = Date.now();
  let expired = false;
  Object.keys(restTimers).forEach(id=>{
    const remain = restTimers[id].end - now;
    const node = document.querySelector(`[data-restcountdown="${id}"]`);
    const fill = document.querySelector(`[data-restfill="${id}"]`);
    if(remain<=0){
      const t = restTimers[id];
      if(t && t.webNoteTimer){ clearTimeout(t.webNoteTimer); t.webNoteTimer = null; }
      delete restTimers[id];
      expired = true;
    } else {
      if(node) node.textContent = restRemainingText(id);
      if(fill) fill.style.width = `${restProgressPct(id)}%`;
    }
  });
  if(!Object.keys(restTimers).length){ clearInterval(restTicker); restTicker = null; }
  if(expired){
    if(!document.hidden) alertRestEndedSecondary();
    if(VIEW==='today') renderApp();
  }
}

function restCardEl(exerciseId){

/* Idle state: one "Start rest" button for the whole workout, sized to the
   Settings default (or a plan-row override when one is passed), plus quick alternates. */
function restStartRowEl(planRow, exerciseName){
  const seconds = restSecondsFor(planRow);

    b.onclick = ()=> startRestTimer(planRow.exerciseId, s, exerciseName);

  });
  wrap.appendChild(alts);
  return wrap;
}

/* Workout clock. elapsedMs is the source of truth; one interval only repaints.
   Time while the WebView is hidden or suspended is not counted. */
let workoutTicker = null;
let workoutSeenAt = 0;
let workoutSaveAt = 0;
function activeWorkoutLog(){
  return (DATA && DATA.logs && DATA.logs.find(l=>l.active)) || null;
}
function clearWorkoutTicker(){
  if(!workoutTicker) return;
  clearInterval(workoutTicker);
  workoutTicker = null;
}
function freezeWorkoutElapsed(log){
  if(!log || !log.timerRunningSince) return;
  log.elapsedMs = workoutElapsedMs(log);
  log.timerRunningSince = null;
}
function discountSuspendedGap(){
  const now = Date.now();
  if(!workoutSeenAt){ workoutSeenAt = now; return; }
  const gap = now - workoutSeenAt;
  workoutSeenAt = now;
  if(gap<=3000) return;
  const log = activeWorkoutLog();
  if(!log || !log.timerRunningSince) return;
  log.timerRunningSince += gap - 1000;
  if(log.timerRunningSince>now) log.timerRunningSince = now;
}
function captureActiveWorkoutElapsed(){
  discountSuspendedGap();
  const log = activeWorkoutLog();
  if(!log || !log.timerRunningSince) return;
  if(document.hidden){ freezeWorkoutElapsed(log); return; }
  log.elapsedMs = workoutElapsedMs(log);
  log.timerRunningSince = Date.now();
}
function paintWorkoutTimer(){
  const node = document.querySelector('[data-workout-timer]');
  if(!node) return;
  const log = activeWorkoutLog();
  if(!log) return;
  node.textContent = formatWorkoutClock(workoutElapsedMs(log));
}
function tickWorkoutTimer(){
  discountSuspendedGap();
  const log = activeWorkoutLog();
  if(!log || document.hidden){
    if(log) freezeWorkoutElapsed(log);
    clearWorkoutTicker();
    if(log) saveData(DATA);
    paintWorkoutTimer();
    return;
  }
  if(!log.timerRunningSince) log.timerRunningSince = Date.now();
  paintWorkoutTimer();
  if(Date.now()-workoutSaveAt>=15000){
    workoutSaveAt = Date.now();
    saveData(DATA);
  }
}
function ensureWorkoutTicker(){
  if(workoutTicker) return;
  workoutSeenAt = Date.now();
  workoutSaveAt = Date.now();
  workoutTicker = setInterval(tickWorkoutTimer, 1000);
}
function syncWorkoutTimer(){
  const log = activeWorkoutLog();
  if(!log || document.hidden){
    if(log && log.timerRunningSince){
      discountSuspendedGap();
      freezeWorkoutElapsed(log);
      clearWorkoutTicker();
      saveData(DATA);
    } else clearWorkoutTicker();
    return;
  }
  if(!log.timerRunningSince) log.timerRunningSince = Date.now();
  ensureWorkoutTicker();
  paintWorkoutTimer();
}
function pauseWorkoutForBackground(){
  const log = activeWorkoutLog();
  if(!log){ clearWorkoutTicker(); return; }
  discountSuspendedGap();
  const changed = !!log.timerRunningSince;
  freezeWorkoutElapsed(log);
  clearWorkoutTicker();
  if(changed) saveData(DATA);
  paintWorkoutTimer();
}
function stopWorkoutClock(log){
  discountSuspendedGap();
  freezeWorkoutElapsed(log);
  clearWorkoutTicker();
}

/* ------------------------------ Today ------------------------------ */
function startWorkout(){
  const log = persistLog(todayLog());
  // Copy the split as it is now. A plan left over from before Start
  // would ignore split edits made while no workout was running.
  if(!log.startedAt) log.plan = null;
  absorbQueuedExercises(log);
  log.active = true;
  if(!log.startedAt) log.startedAt = Date.now();
  if(typeof log.elapsedMs!=='number' || !isFinite(log.elapsedMs) || log.elapsedMs<0) log.elapsedMs = 0;
  log.timerRunningSince = null;
  log.completed = false;
  homeScreen = 'workout';
  VIEW = 'today';
  saveData(DATA);
  renderApp();
}
function reopenWorkout(log){
  absorbQueuedExercises(log);
  log.active = true; log.completed = false; log.endedAt = null;
  if(typeof log.elapsedMs!=='number' || !isFinite(log.elapsedMs) || log.elapsedMs<0) log.elapsedMs = 0;
  log.timerRunningSince = null;
  homeScreen = 'workout';
  VIEW = 'today';
  saveData(DATA);
  closeSheets();
  renderApp();
}
function finishWorkout(){
  const log = todayLog();
  confirmAction("Finish and save today's workout?", 'Finish', ()=>{
    stopWorkoutClock(log);
    log.endedAt = Date.now(); log.active = false; log.completed = true;
    homeScreen = 'landing';
    saveData(DATA);
    openCelebrationSheet(log);
  });
}
/* Auto-finish once every planned set is in the book. */
function autoFinishIfComplete(){
  const log = todayLog();
  if(!log.active) return false;
  const plan = planForLog(log);
  if(!plan.length) return false;
  const done = plan.every(row=> workingSetsInLogFor(log, row.exerciseId).length >= row.sets);
  if(!done) return false;
  stopWorkoutClock(log);
  log.endedAt = Date.now(); log.active = false; log.completed = true;
  homeScreen = 'landing';
  saveData(DATA);
  openCelebrationSheet(log);
  return true;
}

  if(log.sets.length){
    const work = muscleWorkCard(log.sets, 'Muscle work so far');
    if(work) wrap.appendChild(work);
  }

  if(plan.length>=2){
    const ssBox = el(`
      <div class="card flat" style="text-align:center;">
        <button class="btn secondary" data-create-ss style="width:100%;">🔗 Group exercises into a superset</button>
      </div>`);
    q('[data-create-ss]',ssBox).onclick = ()=> openSupersetPickerSheet(plan);
    wrap.appendChild(ssBox);
  }

  const addBox = el(`
    <div class="card flat" style="text-align:center;">
      <button class="btn secondary" data-add style="width:100%;">＋ Add exercise</button>
      <p class="faint small" style="margin-top:8px;">Adds it to this workout. You can keep it on your split, or just for today.</p>
    </div>`);
  q('[data-add]',addBox).onclick = ()=> openExercisePicker({
    title:'Add exercise',
    exclude: plan.map(r=>r.exerciseId),
    onPick:(id)=> addExerciseToActiveWorkout(id)
  });
  wrap.appendChild(addBox);
  return wrap;
}

/* Pick 2-4 of today's exercises and group them into a superset on the fly. */
function openSupersetPickerSheet(plan){
  let picked = new Set();
  function draw(){
    openSheet({
      root:SHEET_ROOT.picker, zIndex:150, title:'Create a superset',
      build:(body, sheet)=>{
        body.appendChild(el(`<p class="faint small" style="margin-bottom:12px;">Pick 2-4 exercises from today's plan to group together.</p>`));
        plan.forEach((row,idx)=>{
          const ex = getExercise(row.exerciseId);
          const already = !!row.supersetId;
          const item = el(`
            <label class="row between" style="padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;">
              <span>${escapeHtml(ex?ex.name:'?')} ${already?'<span class="faint small">(already grouped)</span>':''}</span>
              <input type="checkbox" style="width:auto;" ${picked.has(idx)?'checked':''}>
            </label>`);
          q('input',item).onchange = (e)=>{ e.target.checked ? picked.add(idx) : picked.delete(idx); draw(); };
          body.appendChild(item);
        });
        const canCreate = picked.size>=2 && picked.size<=4;
        const btn = el(`<button class="btn" ${canCreate?'':'disabled'} style="width:100%;margin-top:14px;">Create superset (${picked.size} selected)</button>`);
        btn.onclick = ()=>{
          if(!canCreate) return;
          const groupId = uid();
          plan.forEach((row,idx)=>{ if(picked.has(idx)) row.supersetId = groupId; });
          saveData(DATA);
          sheet.close();
          showToast('Superset created 🔗');
          renderApp();
        };
        body.appendChild(btn);
      }
    });
  }
  draw();
}

/* The interactive part of progressive overload: accept / not today / adjust. */
function progressionBlock(status, planRow){
  const box = el(`<div></div>`);
  if(status.state==='ready'){
    const prompt = el(`
      <div class="prompt-box">
        <div class="ph">🎯 ${escapeHtml(status.headline)}</div>
        ${status.note?`<div class="pn">${escapeHtml(status.note)}</div>`:''}
        <div class="row">
          <button class="btn" data-accept>Use ${status.suggestedWeight}${units()}</button>
          <button class="btn secondary" data-defer>Not today</button>
          <button class="btn secondary" data-adjust>Adjust</button>
        </div>
      </div>`);
    q('[data-accept]',prompt).onclick = ()=>{
      setLoadPlan(status.exerciseId, {weight:status.suggestedWeight, deferred:false});
      showToast(`Locked in — ${status.suggestedWeight}${units()} today 💪`);
      renderApp();
    };
    q('[data-defer]',prompt).onclick = ()=>{
      setLoadPlan(status.exerciseId, {deferred:true, weight:null});
      showToast('No problem — same weight today.');
      renderApp();
    };
    q('[data-adjust]',prompt).onclick = ()=> openLoadAdjustSheet(status);
    box.appendChild(prompt);
    return box;
  }

  box.appendChild(el(`<div class="suggest-box">${escapeHtml(status.headline)}${status.note?' — '+escapeHtml(status.note):''}</div>`));
  if(status.state==='accepted' || status.state==='deferred'){
    const change = el(`<button class="btn ghost" style="padding:4px 0;font-size:12.5px;">Change today's weight</button>`);
    change.onclick = ()=> openLoadAdjustSheet(status);
    box.appendChild(change);
  } else if(status.progressText){
    box.appendChild(el(`
      <div>
        <p class="faint small" style="margin-top:6px;">${escapeHtml(status.progressText)}</p>
        <div class="meter"><span style="width:${Math.min(100, Math.round(status.qualifyingSessions/status.sessionsRequired*100))}%"></span></div>
      </div>`));
  }
  return box;
}

function duplicateLastSet(exerciseId){
  const mine = setsInLogFor(todayLog(), exerciseId);
  if(!mine.length) return null;
  const last = mine[mine.length-1];
  const metric = metricOf(getExercise(exerciseId));
  const clone = {id:uid(), exerciseId, difficulty:last.difficulty, intent:last.isDropSet?null:(last.intent||null), ts:Date.now(), isPR:false, isDropSet:!!last.isDropSet, isWarmup:last.isDropSet?false:!!last.isWarmup};
  if(last.isDropSet) clone.stages = (last.stages||[]).map(s=>({...s}));
  else if(metric==='weight_reps' || metric==='assisted'){ clone.weight=last.weight; clone.reps=last.reps; }
  else if(metric==='reps_only') clone.reps = last.reps;
  else if(metric==='time') clone.duration = last.duration;
  return clone;
}
function repeatLastSet(exerciseId){
  const log = todayLog();
  const clone = duplicateLastSet(exerciseId);
  if(!clone) return;
  log.sets.push(clone);
  persistLog(log);
  recomputePRs(exerciseId);
  saveData(DATA);
  if(clone.isDropSet) showToast('Drop set repeated 🔻'); else celebrateSet(clone);
  if(!autoFinishIfComplete()) renderApp();
}
function repeatSupersetRound(members){
  const log = todayLog();
  if(members.some(m=>!setsInLogFor(log, m.row.exerciseId).length)){
    showToast('Log a round first');
    return;
  }
  const clones = members.map(m=>duplicateLastSet(m.row.exerciseId)).filter(Boolean);
  if(clones.length!==members.length) return;
  clones.forEach(clone=>{
    log.sets.push(clone);
    recomputePRs(clone.exerciseId);
  });
  persistLog(log);
  saveData(DATA);
  const pr = clones.find(s=>s.isPR);
  if(pr) showToast('🏆 New personal record! You crushed it!', true);
  else showToast('Same round logged');
  if(!autoFinishIfComplete()) renderApp();
}
