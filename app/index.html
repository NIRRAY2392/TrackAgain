<script>
/* Apply stored theme before first paint. Default: dark. Key is separate from workout data. */
(function(){
  try{
    var t = localStorage.getItem('trackagain_theme');
    document.documentElement.setAttribute('data-theme', t==='light' ? 'light' : 'dark');
  }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
})();
</script>
